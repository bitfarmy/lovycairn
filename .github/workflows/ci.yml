name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Static checks + packaging + a smoke test in a real headless GNOME Shell: Fedora 44 (GNOME Shell 50) must pass;
  # Rawhide (GNOME Shell 51 and later) is informative: it shows what is coming.
  check:
    name: check (Fedora ${{ matrix.tag }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.tag == 'rawhide' }}
    strategy:
      fail-fast: false
      matrix:
        tag: ["44", rawhide]
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.tag }}
      options: --security-opt seccomp=unconfined
    steps:
      - name: Install dependencies
        run: |
          dnf -y -q install --setopt=install_weak_deps=False gnome-shell mutter gjs glib2 gettext desktop-file-utils git \
            dbus-daemon dbus-x11 nodejs python3 python3-gobject python3-pillow python3-dbusmock unzip zip xdg-user-dirs gtk4 libadwaita
      - uses: actions/checkout@v4
      - name: Checks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gnome-shell --version
          scripts/dev.sh check
      - name: Package
        run: scripts/dev.sh pack
      - name: Smoke test (headless GNOME Shell)
        run: |
          tests/container-setup.sh
          mkdir -p tests/out
          tests/run-headless.sh smoke tests/out
          grep -q "extension state=1" tests/out/shell.log
          grep -q "failedChecks=none" tests/out/shell.log
      - name: Compatibility notice test
        run: |
          tests/container-setup.sh
          tests/run-headless.sh compat tests/out
          grep -q "failedChecks=background-menu" tests/out/shell.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-fedora-${{ matrix.tag }}
          path: |
            tests/out/*.png
            tests/out/shell.log
      - uses: actions/upload-artifact@v4
        if: matrix.tag == '44'
        with:
          name: extension-zip
          path: dist/*.zip
