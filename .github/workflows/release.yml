name: Release

# Pushing a tag vX.Y.Z builds the complete bundle and extension zip and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and verify
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install dependencies
        run: dnf -y -q install --setopt=install_weak_deps=False gnome-shell gjs glib2 gettext desktop-file-utils git nodejs python3 python3-gobject unzip zip gh
      - uses: actions/checkout@v4
      - name: Use current publisher for manual recovery
        if: github.event_name == 'workflow_dispatch'
        run: cp scripts/publish-release.sh /tmp/publish-release.sh
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.tag }}
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/dev.sh check
          scripts/release-artifacts.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            cp /tmp/publish-release.sh scripts/publish-release.sh
          fi
          bash scripts/publish-release.sh "$RELEASE_TAG"
