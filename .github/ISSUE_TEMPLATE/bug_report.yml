name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: doctor
    attributes:
      label: Output of `lovycairn-doctor --report`
      description: Paste it all; it has the versions and the relevant log lines.
      render: text
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
