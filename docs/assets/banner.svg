<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">LovyCairn</title>
  <desc id="d">A cairn of stacked stones, the name LovyCairn and the tagline: your projects, on your desktop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset=".6" stop-color="#121a22"/><stop offset="1" stop-color="#10222a"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6cc6a1" stop-opacity=".30"/><stop offset="1" stop-color="#6cc6a1" stop-opacity="0"/></radialGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93a2b8"/><stop offset="1" stop-color="#586780"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5b2c6"/><stop offset="1" stop-color="#67768f"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ee0bf"/><stop offset="1" stop-color="#47a583"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2f5e6"/><stop offset="1" stop-color="#8ee0bf"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8ecf2"/><stop offset=".5" stop-color="#e8ecf2"/><stop offset=".5" stop-color="#8ee0bf"/><stop offset="1" stop-color="#6cc6a1"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="type1"><rect x="420" y="190" width="0" height="46"><animate attributeName="width" from="0" to="640" dur="1.8s" begin="1.6s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="type2"><rect x="420" y="236" width="0" height="40"><animate attributeName="width" from="0" to="780" dur="2s" begin="3.4s" fill="freeze" calcMode="linear"/></rect></clipPath>
  </defs>
  <style>
    .stone { transform-box: fill-box; transform-origin: center bottom; opacity: 0; animation: drop .9s cubic-bezier(.2,.9,.3,1.25) forwards; }
    .st1 { animation-delay: .15s } .st2 { animation-delay: .45s } .st3 { animation-delay: .75s } .st4 { animation-delay: 1.05s }
    @keyframes drop { 0% { transform: translateY(-190px); opacity: 0 } 18% { opacity: 1 } 100% { transform: translateY(0); opacity: 1 } }
    .title { font: 800 92px/1 'Inter','Segoe UI','Cantarell',system-ui,-apple-system,sans-serif; letter-spacing: -2px; opacity: 0; animation: rise .9s ease-out 1s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    .tag { font: 500 30px/1 'JetBrains Mono','Source Code Pro','DejaVu Sans Mono',ui-monospace,monospace; fill: #aeb8c6; }
    .tag2 { font: 400 22px/1 'JetBrains Mono','Source Code Pro','DejaVu Sans Mono',ui-monospace,monospace; fill: #7d8899; }
    .caret { fill: #6cc6a1; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pill { font: 600 15px 'Inter','Segoe UI',system-ui,sans-serif; }
    .float1 { animation: bob 6s ease-in-out infinite } .float2 { animation: bob 7.5s ease-in-out -2s infinite } .float3 { animation: bob 5.5s ease-in-out -4s infinite }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
    .halo { animation: pulse 5s ease-in-out infinite; transform-origin: 200px 190px; }
    @keyframes pulse { 0%,100% { opacity: .75; transform: scale(1) } 50% { opacity: 1; transform: scale(1.08) } }
    .dot { fill: #6cc6a1; opacity: .5; animation: drift 9s linear infinite }
    @keyframes drift { from { transform: translateY(0); opacity: 0 } 15% { opacity: .55 } to { transform: translateY(-120px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important } }
  </style>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <g opacity=".5" fill="#2a3340">
    <!-- fine dotted grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1"/></pattern>
    <rect width="1280" height="360" fill="url(#grid)"/>
  </g>
  <circle class="halo" cx="200" cy="190" r="190" fill="url(#glow)"/>
  <g>
    <circle class="dot" cx="120" cy="320" r="2.5"/><circle class="dot" cx="290" cy="330" r="2" style="animation-delay:-3s"/><circle class="dot" cx="210" cy="340" r="3" style="animation-delay:-6s"/>
  </g>
  <!-- the cairn -->
  <ellipse cx="200" cy="318" rx="122" ry="12" fill="#000" opacity=".4" filter="url(#blur)"/>
  <g transform="translate(88 70) scale(1.75)">
    <ellipse class="stone st1" cx="64" cy="100" rx="46" ry="19" fill="url(#s1)"/>
    <ellipse class="stone st2" cx="67" cy="72" rx="34" ry="16" fill="url(#s2)"/>
    <ellipse class="stone st3" cx="61" cy="47" rx="22" ry="12.5" fill="url(#s3)"/>
    <ellipse class="stone st4" cx="64" cy="27" rx="10.5" ry="7.5" fill="url(#s4)"/>
  </g>
  <!-- name and tagline -->
  <text class="title" x="416" y="168" fill="url(#word)">LovyCairn</text>
  <g clip-path="url(#type1)"><text class="tag" x="420" y="222">Your projects, on your desktop.</text></g>
  <g clip-path="url(#type2)"><text class="tag2" x="420" y="262">git status · groups · notes · one click to start work</text></g>
  <rect class="caret" x="1040" y="196" width="3" height="32" rx="1.5" opacity="0"><animate attributeName="opacity" values="0;1" dur=".01s" begin="3.2s" fill="freeze"/></rect>
  <!-- floating status chips, like the ones on the desktop icons -->
  <g class="float1"><g transform="translate(980 60)"><rect width="160" height="38" rx="9" fill="#1b212a" stroke="#343c48"/><circle cx="20" cy="19" r="6" fill="#e3ad4b"/><text class="pill" x="36" y="24" fill="#d9dde3">atlas-api  ●3  2h</text></g></g>
  <g class="float2"><g transform="translate(1040 290)"><rect width="150" height="38" rx="9" fill="#1b212a" stroke="#343c48"/><path d="M14 19l5 5 9-10" fill="none" stroke="#6cc6a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="pill" x="40" y="24" fill="#d9dde3">nebula-web  5h</text></g></g>
  <g class="float3"><g transform="translate(860 300)"><rect width="104" height="34" rx="9" fill="#e4c232"/><text class="pill" x="14" y="22" fill="#2a2406">#notes</text></g></g>
</svg>
